name: update stats

# Recalcula o "N+ years building" do journey. O número muda uma vez por ano;
# rodar todo mês garante que a mudança entre no máximo um mês depois e que uma falha se corrija sozinha.
on:
  schedule:
    - cron: "0 9 1 * *"   # dia 1 de cada mês, 09:00 UTC (06:00 em Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-journey.js && node tools/build-light.js
      - name: commit only if something changed
        run: |
          if git diff --quiet; then
            echo "nothing changed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: update years building"
            git push
          fi
