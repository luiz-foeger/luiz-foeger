name: update stats

# Recalcula o "N+ years building" do journey. O número muda duas vezes por ano (3, 3+, 4…);
# rodar todo mês garante que a mudança entre no máximo um mês depois e que uma falha se corrija sozinha.
on:
  schedule:
    - cron: "0 9 1 * *"   # dia 1 de cada mês, 09:00 UTC (06:00 em Brasília)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-journey.js && node tools/build-light.js
      - name: commit only if something changed
        run: |
          if git diff --quiet; then
            echo "nothing changed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: update years building"
            git push
          fi
      # Em repo público o GitHub desliga o agendamento após 60 dias sem atividade, e aqui só há commit
      # quando o número muda. Reativar o próprio workflow a cada execução zera essa contagem, sem commit.
      - name: keep the schedule alive
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-stats.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
